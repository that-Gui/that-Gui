name: profile

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.svg
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats:
    runs-on: ubuntu-latest
    steps:
      # ponytail: main is protected by a ruleset that blocks GITHUB_TOKEN pushes;
      # PROFILE_TOKEN is a fine-grained PAT (Contents: RW, this repo only) owned by a
      # bypass actor, and checkout's persisted creds make the git push below use it.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
      # ponytail: no setup-node. The runner ships node 22.x and type stripping is
      # default-on from 22.18, so scripts/stats.ts runs with no deps and no build.
      # --test runs first: it fails here rather than writing a wrong README.
      - run: node scripts/stats.ts --test
      - run: node scripts/stats.ts
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git diff --quiet README.md || {
            git commit -qam "stats: refresh contribution badges"
            git push
          }

# ponytail: there was a lowlighter/metrics job here. GITHUB_TOKEN is scoped to this
# repo alone, so user-level queries came back empty and it rendered a "0 Languages"
# card. Bringing it back needs a classic PAT with repo scope stored as METRICS_TOKEN.
# The snake above needs no secret because it reads the public contribution calendar.
